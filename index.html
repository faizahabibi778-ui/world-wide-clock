<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>World Clock - FAizAA</title>
  </head>
  <body>
    <div class="container">
      <h1>World Clock</h1>
      <fieldset>
        <select id="city-select">
          <option value="">Select a city..</option>
          <option value="Europe/London">London</option>
          <option value="America/New_York">New York</option>
          <option value="Asia/Kabul">Kabul</option>
        </select>
      </fieldset>

      <div id="cities">
        <div class="city" id="los-angeles">
          <div>
            <h2>Los Angeles 🇺🇸</h2>
            <div class="date">August 15th 2022</div>
          </div>
          <div class="time">1:48:15 <small>AM</small></div>
        </div>

        <div class="city" id="london">
          <div>
            <h2>London 🇬🇧</h2>
            <div class="date">August 15th 2022</div>
          </div>
          <div class="time">9:48:15 <small>AM</small></div>
        </div>

        <div class="city" id="new-york">
          <div>
            <h2>New York 🇺🇸</h2>
            <div class="date">August 15th 2022</div>
          </div>
          <div class="time">4:48:15 <small>AM</small></div>
        </div>

        <div class="city" id="kabul">
          <div>
            <h2>Kabul 🇦🇫</h2>
            <div class="date">August 15th 2022</div>
          </div>
          <div class="time">1:18:15 <small>PM</small></div>
        </div>
      </div>
    </div>

    <footer>
      This project was coded by
      <a href="https://github.com/faizahabibi778-ui" target="_blank">FAIZA</a>
      and is <a href="https://github.com" target="_blank">on GitHub</a> and
      <a href="#" target="_blank">hosted on Netlify</a>
    </footer>
    <script src="index.js"></script>
  </body>
</html>
